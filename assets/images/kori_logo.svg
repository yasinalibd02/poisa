<?xml version="1.0" encoding="UTF-8"?>
<!-- Kori mark: a rounded-square coin with a leaf notch and a "K" cut through
     it. The K is a true cut-out (mask), so the mark works on any background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="koriTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FA98F"/>
      <stop offset="1" stop-color="#14624F"/>
    </linearGradient>
    <clipPath id="koriBody">
      <rect x="0" y="0" width="512" height="512" rx="143" ry="143"/>
    </clipPath>
    <mask id="koriK">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="53.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M174 143 L174 369"/>
        <path d="M358 143 L184 259"/>
        <path d="M184 259 L358 369"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#koriK)">
    <rect x="0" y="0" width="512" height="512" rx="143" ry="143" fill="url(#koriTeal)"/>
    <g clip-path="url(#koriBody)">
      <circle cx="522" cy="-10" r="174" fill="#ffffff" opacity="0.16"/>
      <path d="M379 133 Q451 82 492 20" stroke="#ffffff" stroke-opacity="0.34"
            stroke-width="18" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
